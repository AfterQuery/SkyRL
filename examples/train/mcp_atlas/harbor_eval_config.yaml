# Harbor job config for evaluating a policy on MCP-Atlas tasks.
#
#   set -a; . examples/train/mcp_atlas/.env.mcp_atlas.local; set +a
#   uv run --extra harbor harbor run -p <tasks> --config examples/train/mcp_atlas/harbor_eval_config.yaml
#
# Expects a vLLM server on 127.0.0.1:8000 serving `Qwen3-30B-A3B`. No tool-call parser
# flags are needed: the agent's loop runs inside the task container and talks to the
# OpenAI-compatible endpoint directly, so it reads native `tool_calls`.

jobs_dir: /home/ubuntu/harbor_jobs_mcp_atlas
n_attempts: 1

orchestrator:
  type: local
  # Each trial runs its own container with Postgres plus the simulated services, and all
  # trials share one vLLM server, so this trades container memory against GPU queueing.
  n_concurrent_trials: 10

environment:
  type: docker
  force_build: false
  delete: true

verifier:
  # tests/grade.py runs inside the container and calls the judge. ${VAR} is resolved from
  # the host at trial start and re-serialized as a template when persisted, so keys stay
  # out of trial logs.
  env:
    MCP_ATLAS_JUDGE_KEY: "${MCP_ATLAS_JUDGE_KEY}"
    MCP_ATLAS_JUDGE_BASE_URL: "${MCP_ATLAS_JUDGE_BASE_URL}"
    MCP_ATLAS_JUDGE_MODEL: "${MCP_ATLAS_JUDGE_MODEL}"

agents:
  - name: mcp-atlas
    model_name: hosted_vllm/Qwen3-30B-A3B
    kwargs:
      # localhost from the host's point of view; the agent rewrites it to
      # host.docker.internal or the bridge gateway, since the loop runs in-container.
      api_base: http://127.0.0.1:8000/v1
      # vLLM ignores the key, but the runner refuses to proceed without one.
      api_key: "${MCP_ATLAS_API_KEY:-local}"
      # Steps and tool output stay uncapped, matching upstream's --max-turns and
      # --tool-output-cap defaults of None. The agent derives a wall-clock deadline from
      # the trial's agent timeout so a non-terminating rollout still yields a trajectory.
      max_steps: 0
      tool_output_cap: 0
      max_tokens: 8192
