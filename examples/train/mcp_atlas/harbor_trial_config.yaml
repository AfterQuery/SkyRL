# Harbor TrialConfig for MCP-Atlas RL training.
#
# Used with the existing Harbor entrypoint -- no MCP-Atlas-specific generator is needed,
# because Harbor's per-task container, MCP wiring, and verifier already do that work:
#
#   uv run --isolated --extra fsdp --extra harbor \
#     -m examples.train_integrations.harbor.entrypoints.main_harbor \
#     harbor_trial_config=examples/train/mcp_atlas/harbor_trial_config.yaml ...
#
# SkyRL injects at runtime: task.path, agent.model_name, agent.kwargs.api_base,
# agent.kwargs.session_id, and agent.kwargs.collect_rollout_details.

trials_dir: ~/trials/mcp_atlas

agent:
  # Resolves through Harbor's agent factory. Requires the harbor dependency to include
  # the mcp-atlas agent (AfterQuery/harbor-aq @ aq); on upstream Harbor this name is
  # unknown and the trial will fail at agent construction.
  name: mcp-atlas
  override_timeout_sec: 1800

  kwargs:
    max_turns: 32
    max_tool_calls: 50
    # Match the RL generator's tool_output_cap so a warm-started policy sees the same
    # observation format it was trained on.
    tool_output_cap: 10000
    # Per-turn token IDs and logprobs -> step-wise training with TIS. SkyRL force-enables
    # this when generator.step_wise_trajectories=true; set here so it is explicit.
    collect_rollout_details: true

    model_info:
      # Keep in sync with generator.inference_engine.engine_init_kwargs.max_model_len.
      max_input_tokens: 32768
      max_output_tokens: 32768
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

    llm_kwargs:
      timeout: 900
      max_retries: 0
      top_p: 1.0

environment:
  # Daytona: cloud sandboxes, one per trial, so rollouts parallelise beyond one machine.
  # Requires DAYTONA_API_KEY (or DAYTONA_JWT_TOKEN + DAYTONA_ORGANIZATION_ID); optionally
  # DAYTONA_TARGET to pick a region. Set `type: docker` to run locally instead.
  #
  # Going cloud moves two services out of reach, because a Daytona sandbox cannot see this
  # machine's localhost:
  #   * the judge -- verifier.env below must point at a publicly reachable endpoint, not a
  #     host-local stub;
  #   * the MCP endpoint -- the mcp-atlas agent runs host-side so it still reaches a local
  #     bridge, but the sandbox it proxies to is on this machine. For real isolation the MCP
  #     server should live inside the task image (see the adapter's --mcp-url).
  type: daytona
  override_cpus: 4
  override_memory_mb: 8192
  suppress_override_warnings: true
  kwargs:
    # Stop an idle sandbox rather than leaving it billing.
    auto_stop_interval_mins: 30

  # Keys for the key-gated MCP servers, forwarded into the task container. `:-` supplies an
  # empty default so a missing key does not fail the trial -- that server just stays
  # disabled, and only tasks needing it fail. Populate via
  # examples/train/mcp_atlas/.env.mcp_atlas (or .env.mcp_atlas.local for real secrets).
  env:
    AIRTABLE_API_KEY: "${AIRTABLE_API_KEY:-}"
    ALCHEMY_API_KEY: "${ALCHEMY_API_KEY:-}"
    BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
    E2B_API_KEY: "${E2B_API_KEY:-}"
    EXA_API_KEY: "${EXA_API_KEY:-}"
    GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
    GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    GOOGLE_REFRESH_TOKEN: "${GOOGLE_REFRESH_TOKEN:-}"
    LARA_ACCESS_KEY_ID: "${LARA_ACCESS_KEY_ID:-}"
    LARA_ACCESS_KEY_SECRET: "${LARA_ACCESS_KEY_SECRET:-}"
    MONGODB_CONNECTION_STRING: "${MONGODB_CONNECTION_STRING:-}"
    NOTION_TOKEN: "${NOTION_TOKEN:-}"
    NPS_API_KEY: "${NPS_API_KEY:-}"
    OXYLABS_USERNAME: "${OXYLABS_USERNAME:-}"
    OXYLABS_PASSWORD: "${OXYLABS_PASSWORD:-}"
    SLACK_MCP_XOXC_TOKEN: "${SLACK_MCP_XOXC_TOKEN:-}"
    SLACK_MCP_XOXD_TOKEN: "${SLACK_MCP_XOXD_TOKEN:-}"
    WEATHER_API_KEY: "${WEATHER_API_KEY:-}"

verifier:
  disable: false

  # The verifier runs INSIDE the task container and needs the judge to score claims.
  # ${VAR} is resolved from the host env at trial start (harbor.utils.env.resolve_env_vars)
  # and stays a template when the config is persisted, so keys never land in trial logs.
  env:
    EVAL_LLM_BASE_URL: "${EVAL_LLM_BASE_URL}"
    EVAL_LLM_API_KEY: "${EVAL_LLM_API_KEY}"
    EVAL_LLM_MODEL: "${EVAL_LLM_MODEL}"

