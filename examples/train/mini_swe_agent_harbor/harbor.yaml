# mini-swe-agent config for Harbor tasks.
#
# Schema targets mini-swe-agent v1 (pinned in requirements-miniswe.txt to the scaleapi
# fork @ d74716a, which is 1.15.0). This is the same schema examples/train/mini_swe_agent
# uses, so the templates below are lifted from swebench.yaml with only Harbor-specific
# edits, each marked ADAPTED.
#
# Do NOT carry this file onto mini-swe-agent 2.x without rewriting it. Under v2 the model
# defaults to tool-calling (`tools=[BASH_TOOL]`), which cannot parse the ```bash blocks the
# prompts below ask for; `action_observation_template` moves to the model config as
# `observation_template`; and an `action_regex` is required because v2's default fence is
# ```mswea_bash_command```. uv.lock currently resolves 2.4.2, which is why the pin exists.
#
# Under v1 both AgentConfig and LitellmModelConfig are plain dataclasses, so an unknown key
# in `agent:` or `model:` raises TypeError rather than being silently dropped. That is the
# desired behaviour -- keep it that way by not adding v2-only keys "just in case".
#
# The Harbor-specific difference: Harbor grades the live container by running tests/test.sh,
# so there is no git patch to emit and no /testbed.

agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.

    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).
    Include a THOUGHT section before your command where you explain your reasoning process.
    Format your response as shown in <format_example>.

    <format_example>
    Your reasoning and analysis here. Explain why you want to perform the action.

    ```bash
    your_command_here
    ```
    </format_example>

    Failure to follow these rules will cause your response to be rejected.
  instance_template: |
    Please solve this issue: {{task}}

    You can execute bash commands and edit files to implement the necessary changes.

    ## Recommended Workflow

    This workflows should be done step-by-step so that you can iterate on your changes and any possible problems.

    1. Analyze the codebase by finding and reading relevant files
    2. Create a script to reproduce the issue
    3. Edit the source code to resolve the issue
    4. Verify your fix works by running your script again
    5. Test edge cases to ensure your fix is robust
    6. Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
       Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    ## Important Rules

    1. Every response must contain exactly one action
    2. The action must be enclosed in triple backticks
    3. Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
       However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## Formatting your response

    Here is an example of a correct response:

    <example_response>
    THOUGHT: I need to understand the structure of the repository first. Let me check what files are in the current directory to get a better understanding of the codebase.

    ```bash
    ls -la
    ```
    </example_response>

    ## Useful command examples

    ### Create a new file:

    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```

    ### Edit files with sed:

    {%- if system == "Darwin" -%}
    <important>
    You are on MacOS. For all the below examples, you need to use `sed -i ''` instead of `sed -i`.
    </important>
    {%- endif -%}

    ```bash
    # Replace all occurrences
    sed -i 's/old_string/new_string/g' filename.py

    # Replace only first occurrence
    sed -i 's/old_string/new_string/' filename.py

    # Replace first occurrence on line 1
    sed -i '1s/old_string/new_string/' filename.py

    # Replace all occurrences in lines 1-10
    sed -i '1,10s/old_string/new_string/g' filename.py
    ```

    ### View file content:

    ```bash
    # View specific lines with numbers
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### Any other command you want to run

    ```bash
    anything
    ```
  action_observation_template: |
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
    If you're using grep or find and it produced too much output, you can use a more selective search pattern.
    If you really need to see something from the full command's output, you can redirect output to a file and then search in that file.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    Please always provide EXACTLY ONE action in triple backticks, found {{actions|length}} actions.
    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
    Else, please format your response exactly as follows:

    <response_example>
    Here are some thoughts about why you want to perform the action.

    ```bash
    <action>
    ```
    </response_example>

    Note: In rare cases, if you need to reference a similar format in your command, you might have
    to proceed in two steps, first writing TRIPLEBACKTICKSBASH, then replacing them with ```bash.
  step_limit: 20
  cost_limit: 0.          # cost tracking is meaningless against a local policy

model:
  # v1 LitellmModelConfig accepts only: model_name, model_kwargs, litellm_model_registry,
  # set_cache_control, cost_tracking. It is a dataclass, so anything else is a TypeError --
  # in particular the v2-only observation_template / format_error_template / action_regex
  # belong under `agent:` (above) or nowhere.
  #
  # No model_class: v1's default for an `openai/...` name is LitellmModel, which is the
  # text-based one that parses ```bash blocks. (v2 renamed that to `litellm_textbased` and
  # made the tool-calling variant the default -- do not copy that key back here.)
  cost_tracking: ignore_errors   # litellm cannot price a local vLLM endpoint
  model_kwargs:
    drop_params: true

environment:
  # ADAPTED: SWE-Bench images use /testbed; Harbor images each set their own WORKDIR.
  # This value is only a FALLBACK for images whose Dockerfile declares no WORKDIR --
  # preprocess_harbor.py records the real one per task in instance["workdir"], and
  # init_and_run overrides cwd with it. Keep this at "/" so it always exists: podman
  # refuses to start a container whose workdir is missing.
  cwd: "/"
  timeout: 180
  pull_timeout: 1200
  # PID 1 in the container is `sleep <container_timeout>`, so this is a hard ceiling on
  # agent time PLUS grading time. Set explicitly rather than relying on mini-swe-agent's
  # default, which happens to be the same value.
  #
  # The worst case reaches this exactly: step_limit 20 x timeout 180s = 60 min of agent,
  # plus the 3600s verifier that 27 tasks declare = 120 min. That worst case needs every
  # one of the 20 commands to burn its full 180s, which is unlikely in practice -- but if
  # a container dies mid-grade the verifier writes no reward file, so the trajectory is
  # dropped as a grading failure rather than trained on as a false zero.
  container_timeout: "2h"
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
  environment_class: docker
  executable: podman
  forward_env: []          # do not leak host env (API keys) into model-authored code

run:
  # Rendered with Jinja against the instance dict, then run once after the container starts.
  # Harbor's test.sh writes here and some scripts assume the directory already exists.
  #
  # This works only on v1: get_sb_environment() invokes it as `env.execute(<str>)`, which
  # matches v1's `execute(command: str)`. On v2 the signature is `execute(action: dict)`
  # and the string raises `AttributeError: 'str' object has no attribute 'get'` before the
  # agent is ever constructed -- every trajectory returns empty and generate() fails the
  # whole step with "Found no valid responses". One more reason the pin is not optional.
  env_startup_command: "mkdir -p /logs/verifier"
