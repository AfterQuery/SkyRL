# Harbor TrialConfig for MCP-Atlas RL training.
#
#   uv run --isolated --extra fsdp --extra harbor \
#     -m examples.train_integrations.harbor.entrypoints.main_harbor \
#     harbor_trial_config=examples/train/mcp_atlas/harbor_trial_config.yaml ...
#
# SkyRL injects at runtime: task.path, agent.model_name, agent.kwargs.api_base,
# agent.kwargs.session_id, agent.kwargs.llm_kwargs.extra_body.cache_salt, and
# agent.kwargs.collect_rollout_details (force-enabled when step_wise_trajectories=true).

trials_dir: ~/trials/mcp_atlas

agent:
  # Resolves through Harbor's agent factory. Requires the harbor dependency to include
  # the mcp-atlas agent (AfterQuery/harbor-aq @ aq); on upstream Harbor this name is
  # unknown and the trial fails at agent construction.
  name: mcp-atlas
  override_timeout_sec: 1800

  kwargs:
    # vLLM ignores the key, but the in-container runner refuses to start without one.
    api_key: "${MCP_ATLAS_API_KEY:-local}"

    # Per-turn prompt/completion token IDs and logprobs -> step-wise training with TIS.
    # The runner gets them from the endpoint directly (logprobs + vLLM's
    # return_token_ids), since the loop runs in-container and never touches Harbor's LLM
    # layer. SkyRL force-enables this for step-wise; set here so it is explicit.
    collect_rollout_details: true

    # Eval uses the upstream harness numbers (256 turns, uncapped tool output). Training
    # cannot: every turn re-sends the whole history plus all tool output, so uncapped
    # output walks the prompt into --max-model-len, the endpoint returns HTTP 400, and the
    # trajectory is masked out instead of contributing gradient. AQ task.toml sets
    # max_steps = 20, which is also what the rubrics were authored against.
    #
    # Upstream's own answer to this is compaction (context_window_management='compact',
    # truncating tool results older than the last two turns to 1500 chars). Not usable
    # here: it rewrites earlier turns, and step-wise RL needs each turn's prompt to remain
    # a prefix-extension of the previous one.
    max_steps: 20
    tool_output_cap: 4000
    max_tokens: 4096

    # Sampling. These reach the chat-completions body, so the collected logprobs describe
    # the distribution the rollout was actually drawn from -- which is what off-policy
    # correction assumes.
    temperature: 1.0
    llm_kwargs:
      timeout: 900
      max_retries: 0
      top_p: 1.0

environment:
  # Docker, not Daytona: task Dockerfiles say `FROM mcp-atlas-runtime:<tag>` with no
  # registry, so the tag only resolves on a host that has pulled and re-tagged it. A remote
  # builder has no such image. Switching to Daytona needs the runtime pushed to a registry
  # and the task FROM lines made fully qualified.
  type: docker
  force_build: false
  delete: true

  # No override_cpus / override_memory_mb on purpose. None of the 1000 AQ tasks declares
  # cpus, memory_mb or storage_mb -- their [environment] blocks carry only os and
  # build_timeout_sec -- and Harbor's defaults are None, i.e. no limit. Setting overrides
  # here would be the only source of a limit, and `suppress_override_warnings` would hide
  # it if a task ever did declare its own. Measured: a live task container running the
  # gateway plus five simulated services uses ~305 MiB and ~0.1% of one CPU, so a limit
  # protects nothing and an 8 GB cap could only OOM-kill a heavier task.

  # Keys for the key-gated MCP servers, forwarded into the task container. `:-` supplies an
  # empty default so a missing key does not fail the trial -- that server just stays
  # disabled, and only tasks needing it fail. Mostly irrelevant for AQ-1000, whose services
  # are simulated inside the image. Populate via .env.mcp_atlas.local.
  env:
    AIRTABLE_API_KEY: "${AIRTABLE_API_KEY:-}"
    ALCHEMY_API_KEY: "${ALCHEMY_API_KEY:-}"
    BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
    E2B_API_KEY: "${E2B_API_KEY:-}"
    EXA_API_KEY: "${EXA_API_KEY:-}"
    GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
    GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    GOOGLE_REFRESH_TOKEN: "${GOOGLE_REFRESH_TOKEN:-}"
    LARA_ACCESS_KEY_ID: "${LARA_ACCESS_KEY_ID:-}"
    LARA_ACCESS_KEY_SECRET: "${LARA_ACCESS_KEY_SECRET:-}"
    MONGODB_CONNECTION_STRING: "${MONGODB_CONNECTION_STRING:-}"
    NOTION_TOKEN: "${NOTION_TOKEN:-}"
    NPS_API_KEY: "${NPS_API_KEY:-}"
    OXYLABS_USERNAME: "${OXYLABS_USERNAME:-}"
    OXYLABS_PASSWORD: "${OXYLABS_PASSWORD:-}"
    SLACK_MCP_XOXC_TOKEN: "${SLACK_MCP_XOXC_TOKEN:-}"
    SLACK_MCP_XOXD_TOKEN: "${SLACK_MCP_XOXD_TOKEN:-}"
    WEATHER_API_KEY: "${WEATHER_API_KEY:-}"

verifier:
  disable: false

  # tests/grade.py runs INSIDE the task container and needs the judge to score claims.
  # ${VAR} is resolved from the host env at trial start (harbor.utils.env.resolve_env_vars)
  # and stays a template when the config is persisted, so keys never land in trial logs.
  env:
    MCP_ATLAS_JUDGE_KEY: "${MCP_ATLAS_JUDGE_KEY}"
    MCP_ATLAS_JUDGE_BASE_URL: "${MCP_ATLAS_JUDGE_BASE_URL}"
    MCP_ATLAS_JUDGE_MODEL: "${MCP_ATLAS_JUDGE_MODEL}"
